name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  orchestrator:
    name: Orchestrator tests (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-a-orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend-a-orchestrator/package-lock.json
      - run: npm ci
      - run: npm test

  intelligence:
    name: Intelligence tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-b-intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q
        env:
          MOCK_EMBEDDINGS: "true"

  frontend:
    name: Frontend build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
